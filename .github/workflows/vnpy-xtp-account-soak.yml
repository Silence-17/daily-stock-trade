name: External vn.py XTP A-share Account Soak

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Credentialed no-order observation window
        required: true
        default: '3600'
        type: choice
        options:
          - '900'
          - '3600'
          - '14400'
      min_connected_ratio:
        description: Minimum confirmed connection ratio
        required: true
        default: '0.99'
        type: choice
        options:
          - '0.99'
          - '0.995'
      require_position_event:
        description: Require a position callback for a non-empty account
        required: true
        default: false
        type: boolean
      require_reconnect:
        description: Require a naturally observed reconnect in this window
        required: true
        default: false
        type: boolean

concurrency:
  group: vnpy-xtp-paper-account-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  xtp-account-soak:
    runs-on: windows-2022
    timeout-minutes: 300
    environment: vnpy-xtp-paper-acceptance
    env:
      VNPY_GATEWAY_PLUGINS_JSON: '[{"package":"vnpy_xtp==2.2.32.2.3","module":"vnpy_xtp"}]'
      VNPY_RUNTIME_ENABLED: 'true'
      VNPY_GATEWAY_CLASS: vnpy_xtp:XtpGateway
      VNPY_GATEWAY_NAME: XTP
      VNPY_CONNECT_ON_START: 'true'
      VNPY_PRODUCTION_PREFLIGHT_ENABLED: 'true'
      VNPY_AUTO_ATTACH_EVENTS: 'false'
      VNPY_AUTO_RECONNECT_ENABLED: 'true'
      VNPY_AUTO_RECONNECT_INTERVAL_SECONDS: '15'
      VNPY_AUTO_RECONNECT_MAX_INTERVAL_SECONDS: '60'
      VNPY_AUTO_RECONNECT_CONFIRMATION_GRACE_SECONDS: '60'
      VNPY_SOAK_REPORT: ${{ github.workspace }}\vnpy-xtp-account-soak.json
    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Credentialed XTP acceptance is restricted to the main branch.'
          }

      - name: Materialize protected connection settings
        shell: pwsh
        env:
          VNPY_XTP_CONNECT_SETTINGS_JSON: ${{ secrets.VNPY_XTP_CONNECT_SETTINGS_JSON }}
        run: |
          $raw = $env:VNPY_XTP_CONNECT_SETTINGS_JSON
          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw 'Environment secret VNPY_XTP_CONNECT_SETTINGS_JSON is required.'
          }
          try {
            $settings = $raw | ConvertFrom-Json -AsHashtable
          } catch {
            throw 'Environment secret VNPY_XTP_CONNECT_SETTINGS_JSON must be valid JSON.'
          }
          if (-not ($settings -is [System.Collections.IDictionary]) -or $settings.Count -eq 0) {
            throw 'Environment secret VNPY_XTP_CONNECT_SETTINGS_JSON must be a non-empty object.'
          }
          $requiredKeys = @(
            '账号',
            '密码',
            '客户号',
            '行情地址',
            '行情端口',
            '交易地址',
            '交易端口',
            '行情协议',
            '日志级别',
            '授权码'
          )
          $stringKeys = @('账号', '密码', '行情地址', '交易地址', '授权码')
          $missingKeys = @(
            $requiredKeys | Where-Object { -not $settings.Contains($_) }
          )
          $unexpectedKeys = @(
            $settings.Keys | Where-Object { $_ -notin $requiredKeys }
          )
          $invalidStringKeys = @(
            $stringKeys | Where-Object {
              $settings.Contains($_) -and (
                -not ($settings[$_] -is [string]) -or
                [string]::IsNullOrWhiteSpace([string]$settings[$_]) -or
                [string]$settings[$_] -match '[\r\n]'
              )
            }
          )
          $invalidIntegerKeys = @()
          foreach ($rule in @(
            @{ Key = '客户号'; Min = 1; Max = 99 },
            @{ Key = '行情端口'; Min = 1; Max = 65535 },
            @{ Key = '交易端口'; Min = 1; Max = 65535 }
          )) {
            if (-not $settings.Contains($rule.Key)) {
              continue
            }
            $numberText = [string]$settings[$rule.Key]
            $number = 0L
            if (
              $numberText -notmatch '^[0-9]+$' -or
              -not [long]::TryParse($numberText, [ref]$number) -or
              $number -lt $rule.Min -or
              $number -gt $rule.Max
            ) {
              $invalidIntegerKeys += $rule.Key
            }
          }
          $invalidEnumKeys = @()
          if (
            $settings.Contains('行情协议') -and
            $settings['行情协议'] -cnotin @('TCP', 'UDP')
          ) {
            $invalidEnumKeys += '行情协议'
          }
          if (
            $settings.Contains('日志级别') -and
            $settings['日志级别'] -cnotin @('FATAL', 'ERROR', 'WARNING', 'INFO', 'DEBUG', 'TRACE')
          ) {
            $invalidEnumKeys += '日志级别'
          }
          if (
            $missingKeys.Count -gt 0 -or
            $unexpectedKeys.Count -gt 0 -or
            $invalidStringKeys.Count -gt 0 -or
            $invalidIntegerKeys.Count -gt 0 -or
            $invalidEnumKeys.Count -gt 0
          ) {
            throw @(
              'XTP settings schema mismatch.',
              "missing_keys=$($missingKeys -join ',')",
              "unexpected_keys=$($unexpectedKeys -join ',')",
              "invalid_string_keys=$($invalidStringKeys -join ',')",
              "invalid_integer_keys=$($invalidIntegerKeys -join ',')",
              "invalid_enum_keys=$($invalidEnumKeys -join ',')"
            ) -join ' '
          }
          foreach ($key in @('账号', '密码', '行情地址', '交易地址', '授权码')) {
            Write-Output "::add-mask::$($settings[$key])"
          }
          $settingsPath = Join-Path $env:RUNNER_TEMP 'vnpy-xtp-connect.json'
          [System.IO.File]::WriteAllText(
            $settingsPath,
            $raw,
            [System.Text.UTF8Encoding]::new($false)
          )
          "VNPY_CONNECT_SETTINGS_PATH=$settingsPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application and XTP runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-vnpy.txt
          python scripts/vnpy_gateway_plugins.py --install --verify

      - name: Verify official XTP A-share connection-state contract
        shell: pwsh
        run: python -m pytest tests/test_vnpy_xtp_runtime.py -q -p no:cacheprovider

      - name: Run credentialed no-order XTP soak
        shell: pwsh
        run: |
          $arguments = @(
            'scripts/check_vnpy_gateway_soak.py',
            '--duration-seconds', '${{ inputs.duration_seconds }}',
            '--sample-interval-seconds', '5',
            '--startup-grace-seconds', '120',
            '--min-connected-ratio', '${{ inputs.min_connected_ratio }}',
            '--require-external-gateway',
            '--require-all-default-keys',
            '--require-event', 'account',
            '--checkpoint-interval-seconds', '60',
            '--output-json', $env:VNPY_SOAK_REPORT
          )
          if ('${{ inputs.require_position_event }}' -eq 'true') {
            $arguments += @('--require-event', 'position')
          }
          if ('${{ inputs.require_reconnect }}' -eq 'true') {
            $arguments += '--require-reconnect'
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Summarize sanitized evidence
        if: always() && hashFiles('vnpy-xtp-account-soak.json') != ''
        shell: pwsh
        run: |
          $report = Get-Content -LiteralPath $env:VNPY_SOAK_REPORT -Raw | ConvertFrom-Json
          @(
            "### External XTP A-share account soak",
            "- Phase: ``$($report.phase)``",
            "- Passed: ``$($report.ok)``",
            "- Gateway: ``$($report.gateway.class)`` / ``$($report.gateway.name)``",
            "- Connected ratio: ``$($report.evaluation.connected_ratio)``",
            "- Account events: ``$($report.event_counts.account)``",
            "- Position events: ``$($report.event_counts.position)``",
            "- Reconnect attempts/successes: ``$($report.evaluation.reconnect_attempt_count)`` / ``$($report.evaluation.reconnect_success_count)``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload sanitized soak evidence
        if: always() && hashFiles('vnpy-xtp-account-soak.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: vnpy-xtp-account-soak-${{ github.run_number }}
          path: ${{ env.VNPY_SOAK_REPORT }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove connection settings
        if: always()
        shell: pwsh
        run: |
          $runnerRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $candidatePath = if ([string]::IsNullOrWhiteSpace($env:VNPY_CONNECT_SETTINGS_PATH)) {
            Join-Path $runnerRoot 'vnpy-xtp-connect.json'
          } else {
            $env:VNPY_CONNECT_SETTINGS_PATH
          }
          $settingsPath = [System.IO.Path]::GetFullPath($candidatePath)
          if (-not $settingsPath.StartsWith(
            $runnerRoot + [System.IO.Path]::DirectorySeparatorChar,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw 'Refusing to remove a settings file outside RUNNER_TEMP.'
          }
          Remove-Item -LiteralPath $settingsPath -Force -ErrorAction SilentlyContinue
