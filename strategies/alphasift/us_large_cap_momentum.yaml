# US large-cap trend and quality strategy for AlphaSift's native US pipeline.
name: us_large_cap_momentum
display_name: US Large-Cap Momentum
description: Liquid US large-cap candidates with controlled short-term momentum and quality-aware ranking
version: "1.0"
category: framework
tags: [us, large_cap, momentum, quality, liquid]

screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    exclude_st: false
    amount_min: 20000000
    change_pct_min: -6.0
    change_pct_max: 8.0
    price_min: 3
    price_max: 1200
  tech_weight: 0.45
  factor_weights:
    momentum: 0.30
    value: 0.12
    liquidity: 0.20
    activity: 0.14
    stability: 0.16
    reversal: 0.04
    theme_heat: 0.02
    size: 0.02
  scoring_profile:
    momentum_chase_start_pct: 5.0
    momentum_chase_penalty_slope: 14.0
    momentum_downside_start_pct: -4.0
    momentum_downside_penalty_slope: 10.0
    activity_ideal_volume_ratio: 1.8
    stability_hot_change_pct: 7.0
  risk_profile:
    chase_change_pct: 7.0
    abnormal_volume_ratio: 5.0
    low_llm_confidence: 0.50
  portfolio_profile:
    max_same_bucket: 1
    concentration_penalty: 4.0
    buckets:
      Technology: [Technology, Software, Semiconductors, Hardware]
      Financials: [Banks, Financial Services, Insurance]
      Healthcare: [Healthcare, Biotechnology, Drug Manufacturers]
      Consumer: [Consumer Cyclical, Consumer Defensive, Retail]
      Industrials: [Industrials, Aerospace, Machinery]
      Energy: [Energy, Oil & Gas]
  scorecard_profile:
    value_quality_bonus: 1.5
    capital_confirmed_bonus: 2.0
    volume_spike_ratio: 4.5
    hot_money_penalty: 2.0
  ranking_hints: |
    Prefer liquid US large caps with confirmed but not overextended momentum,
    stable price action, and diversified sector exposure. Penalize sharp chasing,
    abnormal volume, and candidates whose quality evidence is incomplete.
  max_output: 5
